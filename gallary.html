<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Ala-archa nature park</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="gallery">
  <div class="page">
    <header class="header" id="site-header"></header>
    <main class="wrap">
      <h1 class="title">Gallery</h1>
      <div class="filters" id="filters" role="group" aria-label="Filter photos"></div>
      <div class="gallery" id="gallery"></div>
      <dialog id="viewer"><img src="" alt=""><p></p><button class="btn" type="button">Close</button></dialog>
    </main>
    <footer class="footer" id="site-footer"></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
