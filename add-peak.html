<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log a peak | Ala-Archa Nature Park</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="add">
  <div class="page">
    <header class="header" id="site-header">
      <a class="logo" href="index.html">Ala-Archa <small>NATURE PARK</small></a>
      <nav class="nav" aria-label="Main">
        <a class="nav__link" href="index.html">Home</a>
        <a class="nav__link" href="gallery.html">Gallery</a>
        <a class="nav__link" href="top.html">Leaderboard</a>
        <a class="nav__link" href="add-peak.html" aria-current="page">Log a peak</a>
      </nav>
    </header>

    <main class="wrap">
      <h1 class="title">Log a peak</h1>
      <form class="form" id="ascent-form">
        <label for="climber-name">Your name
          <input id="climber-name" name="name" required minlength="2" maxlength="40" autocomplete="name">
        </label>

        <label for="peak-select">Peak
          <select id="peak-select" name="peak" required>
            <option value="" disabled selected>Loading peaks...</option>
          </select>
        </label>

        <label for="climb-date">Date of ascent
          <input id="climb-date" type="date" name="date" required>
        </label>

        <label for="climb-note">Note (route, weather, who you went with)
          <textarea id="climb-note" name="note" rows="3" maxlength="500"></textarea>
        </label>

        <button class="btn" type="submit">Save ascent</button>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </main>

    <footer class="footer" id="site-footer"><b>Ala-Archa</b>Nature park, Kyrgyzstan</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
