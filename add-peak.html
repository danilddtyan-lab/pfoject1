<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log a peak | Ala-archa nature park</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="add">
  <div class="page">
       <!-- Верхняя панель: логотип и меню -->
    <header class="header" id="site-header">
      <a class="logo" href="index.html">Ala-Archa <small>NATURE PARK</small></a>
      <nav class="nav" aria-label="Main">
        <a class="nav__link" href="index.html" aria-current="page">Home</a>
        <a class="nav__link" href="gallery.html">Gallery</a>
        <a class="nav__link" href="top.html">Leaderboard</a>
        <a class="nav__link" href="add-peak.html">Log a peak</a>
      </nav>
    </header>
    <main class="wrap">
      <h1 class="title">Log a peak</h1>
      <form class="form" id="ascent-form">
        <label>Your name <input name="name" required minlength="2" maxlength="40" autocomplete="name"></label>
        <label>Peak <select name="peak" required></select></label> 
        <label for="peak">Выберите или введите названиие пика и высоту:</label>
<input list="cities" id="city" name="city">

<datalist id="Вершины">
  <option value="Пик корона">
  <option value="Ош">
  <option value="Алматы">
  <option value="Ташкент">
</datalist>

        <label>Date of ascent <input type="date" name="date" required></label>
        <label>Note (route, weather, who you went with) <textarea name="note" rows="3" maxlength="500"></textarea></label>
        <button class="btn" type="submit">Save ascent</button>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </main>
    <footer class="footer" id="site-footer"></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
